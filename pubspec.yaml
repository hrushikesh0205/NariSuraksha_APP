name: nari_suraksha
description: Nari Suraksha - AI-driven women's safety and emergency response mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.6

  # ── State Management ────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Location & Permissions ──────────────────────────────────────────────────
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # ── Connectivity ────────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.4

  # ── URL Launcher (phone dialler, maps share) ────────────────────────────────
  url_launcher: ^6.3.0

  # ── Utilities ───────────────────────────────────────────────────────────────
  intl: ^0.20.2
  internet_connection_checker_plus: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

# ── flutter_launcher_icons configuration ──────────────────────────────────────
flutter_launcher_icons:
  # Android adaptive icon
  android: true
  ios: false                        # iOS not targeted for now

  # Source icon (1024×1024 PNG)
  image_path: "assets/icons/app_icon.png"

  # Adaptive icon layers (Android 8+)
  adaptive_icon_background: "#FFFFFF"   # pure white background layer
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  # Web (not used but safe to include)
  web:
    generate: false

  # Remove alpha channel for legacy Android (avoids Play Store warnings)
  remove_alpha_ios: false
  background_color_ios: "#FFFFFF"
