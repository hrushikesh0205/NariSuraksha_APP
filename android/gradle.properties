org.gradle.jvmargs=-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Limit worker threads to prevent native OOM on low-memory machines
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true
# Run Kotlin compilation inside the Gradle JVM (no separate Kotlin daemon JVM)
# This prevents the two-JVM memory clash that caused the Kotlin daemon to crash
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

